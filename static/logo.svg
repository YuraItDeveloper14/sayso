<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Sayso">
  <title>Sayso</title>

  <rect width="128" height="128" rx="28" fill="#14100c"/>

  <!-- Speech bubble: what you say. Tail points down-left, toward the speaker. -->
  <path d="M64 33c26.5 0 45 15.8 45 33.5 0 17.7-18.5 32.5-45 32.5-5.6 0-11-.6-15.9-1.8
           -4.6 3.9-10.4 6.6-16.4 7.7-1.5.3-2.5-1.2-1.6-2.4 2.7-3.6 4.7-7.6 5.6-11.6
           C21.4 84.6 19 76 19 66.5 19 48.8 37.5 33 64 33Z"
        fill="none" stroke="#f0a830" stroke-width="6.5" stroke-linejoin="round"/>

  <!-- Microphone capsule: the thing that hears it. -->
  <rect x="49" y="46" width="21" height="42" rx="10.5" fill="#86a86b"/>

  <!-- Cradle and stand. -->
  <path d="M43.5 66.5v4a16 16 0 0 0 32 0v-4M59.5 86.5v13"
        fill="none" stroke="#f0a830" stroke-width="6" stroke-linecap="round"/>

  <!-- Three waves: it heard you. Same ladder as the level meter. -->
  <g stroke="#e04a25" stroke-width="6" stroke-linecap="round">
    <path d="M79 60.5 87.5 55"/>
    <path d="M82 69.5h10"/>
    <path d="M79 78.5 87.5 84"/>
  </g>
</svg>
